<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kal AI - 3D Heritage AR (Basilica of Bom Jesus)</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- A-Frame pinned via CDN (stable 1.5.0) -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>

    <!-- Project source files -->
    <script type="module" src="./src/boot.js"></script>
    <script type="module" src="./src/components/perf-hud.js"></script>
    <script type="module" src="./src/components/controller-input.js"></script>
    <script type="module" src="./src/components/hand-input.js"></script>
    <script type="module" src="./src/components/site-anchor.js"></script>
    <script type="module" src="./src/components/room-occluder.js"></script>
    <script type="module" src="./src/components/avatar-guide.js"></script>
    <script type="module" src="./src/components/stt-ptt.js"></script>
    <script type="module" src="./src/components/basilica-builder.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            background-color: #030712;
            color: #f9fafb;
            user-select: none;
        }

        /* Glassmorphic Header UI */
        #app-header {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 22px;
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(56, 189, 248, 0.4);
        }

        .brand-text h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-text p {
            margin: 2px 0 0 0;
            font-size: 12px;
            color: #94a3b8;
            font-weight: 500;
        }

        .btn-ar {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.4);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-ar:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }

        /* Floating Bottom "Before & After" Mode Switcher */
        #view-panel {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            padding: 10px 14px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            z-index: 100;
        }

        .mode-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25 ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 4px 16px rgba(56, 189, 248, 0.4);
        }

        .mode-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.12);
            color: #f8fafc;
        }

        /* Modal Info Dialog */
        #info-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 90%;
            max-width: 420px;
            background: #0f172a;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        #info-modal.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }

        #info-modal h3 { margin: 0 0 8px 0; color: #f8fafc; font-size: 20px; }
        #info-modal p { color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
        .close-btn { width: 100%; background: #1e293b; color: #f8fafc; border: none; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; }
        .close-btn:hover { background: #334155; }
    </style>
</head>
<body>

    <!-- Kal AI Header UI -->
    <div id="app-header">
        <div class="brand-title">
            <div class="brand-icon">K</div>
            <div class="brand-text">
                <h1>Kal AI</h1>
                <p>3D Heritage Reconstruction • Basilica of Bom Jesus, Goa</p>
            </div>
        </div>
        <button class="btn-ar" onclick="document.querySelector('a-scene').enterVR()">
            Enter Meta Quest 3S AR
        </button>
    </div>

    <!-- Floating "Before & After" View Selector -->
    <div id="view-panel">
        <button class="mode-btn active" id="btn-before" onclick="setMode('before')">
            ✨ Before (Pristine 1594 3D)
        </button>
        <button class="mode-btn" id="btn-after" onclick="setMode('after')">
            🧱 After (Broken Laterite 3D)
        </button>
        <button class="mode-btn" id="btn-split" onclick="setMode('side-by-side')">
            🔄 Side-by-Side 3D
        </button>
    </div>

    <!-- Modal Dialog -->
    <div id="info-modal">
        <h3 id="modal-title">Hotspot Details</h3>
        <p id="modal-desc">Description text...</p>
        <button class="close-btn" onclick="hideHotspotModal()">Close</button>
    </div>

    <!-- A-Frame Scene -->
    <a-scene 
        webxr="optionalFeatures: hit-test, anchors, mesh-detection, plane-detection; referenceSpaceType: local-floor;"
        renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;"
        perf-hud
    >
        <a-assets>
            <img id="img-guide" src="./assets/images/guide_portrait.jpg">
            <img id="img-ground" src="./assets/images/courtyard_ground.jpg">
        </a-assets>

        <!-- Dynamic Lighting Setup -->
        <a-entity light="type: ambient; color: #E2E8F0; intensity: 0.95"></a-entity>
        <a-entity light="type: directional; color: #fff1d6; intensity: 1.6; castShadow: true" position="6 10 5"></a-entity>

        <!-- Clean Sky Atmosphere (No City Image) -->
        <a-sky color="#0b1329"></a-sky>

        <!-- Camera Rig with Orbit Controls for 360-degree 3D View -->
        <a-entity id="camera-rig" position="0 0 0">
            <a-entity id="main-camera" camera look-controls orbit-controls="target: 0 1.2 0; initialPosition: 0 2.4 5.5; enableDamping: true; dampingFactor: 0.08"></a-entity>
            
            <!-- Quest Controllers & Hand Tracking -->
            <a-entity id="right-controller" controller-input="hand: right"></a-entity>
            <a-entity id="left-controller" controller-input="hand: left"></a-entity>
            <a-entity id="right-hand" hand-input="hand: right"></a-entity>
            <a-entity id="left-hand" hand-input="hand: left"></a-entity>
        </a-entity>

        <!-- Heritage Site Container (Volumetric 3D Monument) -->
        <a-entity id="site-container" site-anchor position="0 0 0">
            
            <!-- Mode Title Tag -->
            <a-text id="mode-text" value="BEFORE: 1594 Pristine Golden Baroque 3D" position="0 3.8 0" align="center" scale="0.85 0.85 0.85" color="#38bdf8"></a-text>

            <!-- 1. PURE 3D VOLUMETRIC BEFORE MODEL (Pristine 1594 Restoration) -->
            <a-entity id="model-before" basilica-builder="type: reconstructed" position="0 0 0" visible="true"></a-entity>

            <!-- 2. PURE 3D VOLUMETRIC AFTER MODEL (Old & Broken Laterite Ruin) -->
            <a-entity id="model-after" basilica-builder="type: ruin" position="0 0 0" visible="false"></a-entity>

            <!-- 3D Paved Stone Courtyard Ground Base -->
            <a-plane position="0 -0.05 0" rotation="-90 0 0" width="36" height="36" src="#img-ground" material="repeat: 9 9; roughness: 0.9" shadow="receive: true"></a-plane>

            <!-- 3D Hotspot 1: St. Xavier Tomb -->
            <a-entity position="1.1 1.4 1.4" class="hotspot clickable" onclick="showHotspotModal('Tomb of St. Francis Xavier', 'The mausoleum inside the Basilica holds the sacred mortal remains of St. Francis Xavier, housed in an intricate silver casket crafted by Florentine artist Foggini in 1698.')">
                <a-sphere radius="0.09" color="#ec4899" material="emissive: #ec4899; emissiveIntensity: 0.6"></a-sphere>
                <a-ring rotation="-90 0 0" radius-inner="0.11" radius-outer="0.14" color="#f472b6" material="emissive: #f472b6; emissiveIntensity: 0.8"></a-ring>
                <a-text value="St. Xavier Tomb" position="0 0.22 0" align="center" scale="0.38 0.38 0.38" color="#f472b6"></a-text>
            </a-entity>

            <!-- 3D Hotspot 2: Twin Bell Towers -->
            <a-entity position="-1.7 2.4 0.9" class="hotspot clickable" onclick="showHotspotModal('Twin Bell Towers', 'The twin bell towers flank the main nave, constructed with local red laterite stone and white lime mortar during the Portuguese colonial era.')">
                <a-sphere radius="0.09" color="#f59e0b" material="emissive: #f59e0b; emissiveIntensity: 0.6"></a-sphere>
                <a-ring rotation="-90 0 0" radius-inner="0.11" radius-outer="0.14" color="#fbbf24" material="emissive: #fbbf24; emissiveIntensity: 0.8"></a-ring>
                <a-text value="Twin Bell Towers" position="0 0.22 0" align="center" scale="0.38 0.38 0.38" color="#fbbf24"></a-text>
            </a-entity>

            <!-- Holographic Avatar Guide Entity (Father Domingos) -->
            <a-entity id="avatar-guide" avatar-guide position="-2.4 0 1.4" rotation="0 35 0"></a-entity>

        </a-entity>
    </a-scene>

    <script>
        function setMode(mode) {
            const beforeModel = document.getElementById('model-before');
            const afterModel = document.getElementById('model-after');
            const modeText = document.getElementById('mode-text');

            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));

            if (mode === 'before') {
                document.getElementById('btn-before').classList.add('active');
                beforeModel.setAttribute('visible', 'true');
                beforeModel.setAttribute('position', '0 0 0');
                afterModel.setAttribute('visible', 'false');
                modeText.setAttribute('value', 'BEFORE: 1594 Pristine Golden Baroque 3D');
                modeText.setAttribute('color', '#38bdf8');
            } else if (mode === 'after') {
                document.getElementById('btn-after').classList.add('active');
                beforeModel.setAttribute('visible', 'false');
                afterModel.setAttribute('visible', 'true');
                afterModel.setAttribute('position', '0 0 0');
                modeText.setAttribute('value', 'AFTER: Old & Broken Laterite Ruin 3D');
                modeText.setAttribute('color', '#f97316');
            } else if (mode === 'side-by-side') {
                document.getElementById('btn-split').classList.add('active');
                beforeModel.setAttribute('visible', 'true');
                beforeModel.setAttribute('position', '-2.6 0 0');
                afterModel.setAttribute('visible', 'true');
                afterModel.setAttribute('position', '2.6 0 0');
                modeText.setAttribute('value', 'SIDE-BY-SIDE 3D COMPARISON (1594 vs Present)');
                modeText.setAttribute('color', '#a855f7');
            }
        }

        function showHotspotModal(title, desc) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-desc').textContent = desc;
            document.getElementById('info-modal').classList.add('active');
        }

        function hideHotspotModal() {
            document.getElementById('info-modal').classList.remove('active');
        }
    </script>
</body>
</html>
