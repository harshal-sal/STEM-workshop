<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Basilica of Bom Jesus - Before & After Heritage AR</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- A-Frame pinned via CDN (stable 1.5.0) -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>

    <!-- Project source files -->
    <script type="module" src="./src/boot.js"></script>
    <script type="module" src="./src/components/perf-hud.js"></script>
    <script type="module" src="./src/components/controller-input.js"></script>
    <script type="module" src="./src/components/hand-input.js"></script>
    <script type="module" src="./src/components/site-anchor.js"></script>
    <script type="module" src="./src/components/room-occluder.js"></script>
    <script type="module" src="./src/components/avatar-guide.js"></script>
    <script type="module" src="./src/components/stt-ptt.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            background-color: #030712;
            color: #f9fafb;
            user-select: none;
        }

        /* Glassmorphic Header UI */
        #app-header {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 20px;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
        }

        .brand-text h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(90deg, #f3f4f6, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-text p {
            margin: 2px 0 0 0;
            font-size: 12px;
            color: #38bdf8;
            font-weight: 500;
        }

        .btn-ar {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.4);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-ar:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }

        /* Floating Bottom "Before & After" Mode Switcher */
        #view-panel {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            padding: 10px 14px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            z-index: 100;
        }

        .mode-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25 ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 4px 16px rgba(56, 189, 248, 0.4);
        }

        .mode-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.12);
            color: #f8fafc;
        }

        /* Modal Info Dialog */
        #info-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 90%;
            max-width: 420px;
            background: #0f172a;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        #info-modal.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }

        #info-modal h3 { margin: 0 0 8px 0; color: #f8fafc; font-size: 20px; }
        #info-modal p { color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
        .close-btn { width: 100%; background: #1e293b; color: #f8fafc; border: none; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; }
        .close-btn:hover { background: #334155; }
    </style>
</head>
<body>

    <!-- Header UI -->
    <div id="app-header">
        <div class="brand-title">
            <div class="brand-icon">🏛️</div>
            <div class="brand-text">
                <h1>Basilica of Bom Jesus</h1>
                <p>Before & After Architectural Comparison • Old Goa</p>
            </div>
        </div>
        <button class="btn-ar" onclick="document.querySelector('a-scene').enterVR()">
            Enter Meta Quest 3S AR
        </button>
    </div>

    <!-- Floating "Before & After" View Selector -->
    <div id="view-panel">
        <button class="mode-btn active" id="btn-before" onclick="setMode('before')">
            🏛️ Before (1594 Golden Age)
        </button>
        <button class="mode-btn" id="btn-after" onclick="setMode('after')">
            🧱 After (Modern Laterite)
        </button>
        <button class="mode-btn" id="btn-split" onclick="setMode('side-by-side')">
            🔄 Side-by-Side
        </button>
    </div>

    <!-- Modal Dialog -->
    <div id="info-modal">
        <h3 id="modal-title">Hotspot Details</h3>
        <p id="modal-desc">Description text...</p>
        <button class="close-btn" onclick="hideHotspotModal()">Close</button>
    </div>

    <!-- A-Frame Scene -->
    <a-scene 
        webxr="optionalFeatures: hit-test, anchors, mesh-detection, plane-detection; referenceSpaceType: local-floor;"
        renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;"
        perf-hud
    >
        <a-assets>
            <img id="img-reconstructed" src="./assets/images/basilica_reconstructed.jpg">
            <img id="img-ruin" src="./assets/images/basilica_ruin.jpg">
            <img id="img-guide" src="./assets/images/guide_portrait.jpg">
            <img id="img-sky" src="./assets/images/goa_skybox.jpg">
        </a-assets>

        <!-- Lighting Setup: Warm Tropical Sunset Sunlight -->
        <a-entity light="type: ambient; color: #FFF; intensity: 0.95"></a-entity>
        <a-entity light="type: directional; color: #ffdfa9; intensity: 1.5; castShadow: true" position="5 8 4"></a-entity>

        <!-- Panoramic Goa Sunset Skybox Background -->
        <a-sky src="#img-sky" rotation="0 -90 0"></a-sky>

        <!-- Camera Rig with Orbit Controls -->
        <a-entity id="camera-rig" position="0 0 0">
            <a-entity id="main-camera" camera look-controls orbit-controls="target: 0 1.2 0; initialPosition: 0 2.0 4.2; enableDamping: true; dampingFactor: 0.08"></a-entity>
            
            <!-- Quest Controllers & Hand Tracking -->
            <a-entity id="right-controller" controller-input="hand: right"></a-entity>
            <a-entity id="left-controller" controller-input="hand: left"></a-entity>
            <a-entity id="right-hand" hand-input="hand: right"></a-entity>
            <a-entity id="left-hand" hand-input="hand: left"></a-entity>
        </a-entity>

        <!-- Heritage Site Container -->
        <a-entity id="site-container" site-anchor position="0 0 0">
            
            <!-- Mode Title Tag -->
            <a-text id="mode-text" value="BEFORE: 1594 Golden Age Reconstruction" position="0 3.2 0" align="center" scale="0.85 0.85 0.85" color="#38bdf8"></a-text>

            <!-- 1. BEFORE MODEL (1594 Golden Age Facade Structure) -->
            <a-entity id="model-before" position="0 0 0" visible="true">
                <a-plane width="3.6" height="2.4" src="#img-reconstructed" material="roughness: 0.4" shadow="cast: true"></a-plane>
                <!-- Architectural Framing Pillars -->
                <a-box position="-1.82 0 0.05" width="0.12" height="2.45" depth="0.15" color="#d97706"></a-box>
                <a-box position="1.82 0 0.05" width="0.12" height="2.45" depth="0.15" color="#d97706"></a-box>
                <a-box position="0 1.22 0.05" width="3.76" height="0.12" depth="0.15" color="#d97706"></a-box>
            </a-entity>

            <!-- 2. AFTER MODEL (Modern Laterite Ruin Facade Structure) -->
            <a-entity id="model-after" position="0 0 0" visible="false">
                <a-plane width="3.6" height="2.4" src="#img-ruin" material="roughness: 0.8" shadow="cast: true"></a-plane>
                <!-- Weathered Laterite Framing Pillars -->
                <a-box position="-1.82 0 0.05" width="0.12" height="2.45" depth="0.15" color="#782e1e"></a-box>
                <a-box position="1.82 0 0.05" width="0.12" height="2.45" depth="0.15" color="#782e1e"></a-box>
                <a-box position="0 1.22 0.05" width="3.76" height="0.12" depth="0.15" color="#782e1e"></a-box>
            </a-entity>

            <!-- Paved Stone Courtyard Ground Base -->
            <a-cylinder position="0 -1.22 0" radius="3.5" height="0.1" color="#1e293b" material="roughness: 0.95" shadow="receive: true">
                <a-ring position="0 0.051 0" rotation="-90 0 0" radius-inner="3.45" radius-outer="3.5" color="#38bdf8" material="emissive: #38bdf8; emissiveIntensity: 0.6"></a-ring>
            </a-cylinder>

            <!-- Hotspot 1: St. Xavier Tomb -->
            <a-entity position="0.9 0.4 0.2" class="hotspot clickable" onclick="showHotspotModal('Tomb of St. Francis Xavier', 'The mausoleum inside the Basilica holds the sacred mortal remains of St. Francis Xavier, housed in an intricate silver casket crafted by Italian sculptor Giovanni Battista Foggini in 1698.')">
                <a-sphere radius="0.09" color="#ec4899" material="emissive: #ec4899; emissiveIntensity: 0.6"></a-sphere>
                <a-ring rotation="-90 0 0" radius-inner="0.11" radius-outer="0.14" color="#f472b6" material="emissive: #f472b6; emissiveIntensity: 0.8"></a-ring>
                <a-text value="St. Xavier Tomb" position="0 0.22 0" align="center" scale="0.38 0.38 0.38" color="#f472b6"></a-text>
            </a-entity>

            <!-- Hotspot 2: Laterite Facade Info -->
            <a-entity position="-0.9 -0.2 0.2" class="hotspot clickable" onclick="showHotspotModal('Exposed Laterite Facade', 'In 1950, Portuguese conservators peeled away the white lime plaster coat to reveal the distinctive porous red laterite stone structure seen today.')">
                <a-sphere radius="0.09" color="#f59e0b" material="emissive: #f59e0b; emissiveIntensity: 0.6"></a-sphere>
                <a-ring rotation="-90 0 0" radius-inner="0.11" radius-outer="0.14" color="#fbbf24" material="emissive: #fbbf24; emissiveIntensity: 0.8"></a-ring>
                <a-text value="Laterite Facade" position="0 0.22 0" align="center" scale="0.38 0.38 0.38" color="#fbbf24"></a-text>
            </a-entity>

            <!-- Holographic Avatar Guide Entity (Father Domingos) -->
            <a-entity id="avatar-guide" avatar-guide position="-2.2 -1.2 0.8" rotation="0 30 0"></a-entity>

        </a-entity>
    </a-scene>

    <script>
        function setMode(mode) {
            const beforeModel = document.getElementById('model-before');
            const afterModel = document.getElementById('model-after');
            const modeText = document.getElementById('mode-text');

            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));

            if (mode === 'before') {
                document.getElementById('btn-before').classList.add('active');
                beforeModel.setAttribute('visible', 'true');
                beforeModel.setAttribute('position', '0 0 0');
                afterModel.setAttribute('visible', 'false');
                modeText.setAttribute('value', 'BEFORE: 1594 Golden Age Reconstruction');
                modeText.setAttribute('color', '#38bdf8');
            } else if (mode === 'after') {
                document.getElementById('btn-after').classList.add('active');
                beforeModel.setAttribute('visible', 'false');
                afterModel.setAttribute('visible', 'true');
                afterModel.setAttribute('position', '0 0 0');
                modeText.setAttribute('value', 'AFTER: Modern Exposed Laterite Facade');
                modeText.setAttribute('color', '#f97316');
            } else if (mode === 'side-by-side') {
                document.getElementById('btn-split').classList.add('active');
                beforeModel.setAttribute('visible', 'true');
                beforeModel.setAttribute('position', '-2.0 0 0');
                afterModel.setAttribute('visible', 'true');
                afterModel.setAttribute('position', '2.0 0 0');
                modeText.setAttribute('value', 'SIDE-BY-SIDE COMPARISON (1594 vs Present)');
                modeText.setAttribute('color', '#a855f7');
            }
        }

        function showHotspotModal(title, desc) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-desc').textContent = desc;
            document.getElementById('info-modal').classList.add('active');
        }

        function hideHotspotModal() {
            document.getElementById('info-modal').classList.remove('active');
        }
    </script>
</body>
</html>
